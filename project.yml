name: FollowerCrusade
options:
  bundleIdPrefix: com.communitypoke
  deploymentTarget:
    macOS: "13.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    PRODUCT_NAME: FollowerCrusade
targets:
  FollowerCrusade:
    type: application
    platform: macOS
    sources:
      - path: Sources/FollowerCrusade
      - path: Sources/FollowerCrusadeCore
    info:
      path: Resources/Info.plist
      properties:
        CFBundleName: Follower Crusade
        CFBundleDisplayName: Follower Crusade
        CFBundleIdentifier: com.communitypoke.followercrusade
        LSUIElement: true
        NSPrincipalClass: NSApplication
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.communitypoke.followercrusade
      GENERATE_INFOPLIST_FILE: NO
      INFOPLIST_FILE: Resources/Info.plist
